<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnight</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e),
                        url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1080&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            padding: 1rem;
        }
 
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
        }
 
        .question {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }
 
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
 
        button {
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
 
        button:hover,
        button:active {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
 
        .response {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 300;
            min-height: 1.5em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }
 
        @media (max-width: 480px) {
            h1 {
                font-size: 3.5rem;
            }
            .question {
                font-size: 1.2rem;
            }
            button {
                padding: 0.7rem 1.5rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <h1>Goodnight</h1>
    <p class="question">Kumain kana ba?</p>
    <div class="buttons">
        <button onclick="respond('Oo')">Oo</button>
        <button onclick="respond('Hindi pa')">Hindi pa</button>
    </div>
    <p class="response" id="response"></p>
 
    <script>
        function respond(answer) {
            const response = document.getElementById('response');
            if (answer === 'Oo') {
                response.textContent = 'Yun ohhh';
            } else {
                response.textContent = 'Awwwww';
            }
        }
    </script>
</body>
